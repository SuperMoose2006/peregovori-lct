<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Диалог">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c0883c"/>
      <stop offset="1" stop-color="#8a5f22"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed brass field: safe for maskable (all meaningful marks sit inside
       the central 60% so no mask crops them). -->
  <rect width="512" height="512" fill="url(#g)"/>
  <text x="256" y="270" font-family="Georgia, 'Times New Roman', 'Palatino Linotype', serif"
        font-size="300" font-weight="700" fill="#f3eee3" text-anchor="middle"
        dominant-baseline="central">Д</text>
  <!-- The brand's brass dot, rendered dark to read as the «Диалог.» accent. -->
  <circle cx="366" cy="332" r="26" fill="#14110d"/>
</svg>
